<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра: Угадай число</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Угадайте число от 1 до 100</h1>
        
        <div class="input-group">
            <input type="number" id="user-input" min="1" max="100" placeholder="Введите число">
            <button id="check-btn">Проверить</button>
        </div>

        <p id="message" class="message"></p>
        <p class="attempts">Количество попыток: <span id="attempts-count">0</span></p>

        <button id="restart-btn" class="restart-btn hidden">Играть заново</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
